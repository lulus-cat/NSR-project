# 파인튜닝 모델을 Releases 에 올린다.
#
# 왜 필요한가: ggml 모델은 수백 MB 라 채팅으로도, git 커밋으로도 못 옮긴다.
# 대신 이 워크플로에 HuggingFace 파일 주소를 주면 러너가 받아서
# Releases 에 붙인다. 앱의 "직접 추가"에서 그 주소를 넣으면 끝이다.
#
# 실행: Actions 탭 → "모델 릴리스" → Run workflow → 주소·이름 입력.
name: 모델 릴리스

on:
  workflow_dispatch:
    inputs:
      url:
        description: "모델 파일 주소 (HuggingFace resolve 링크 등, .bin)"
        required: true
      name:
        description: "파일 이름 (예: ggml-ko-medium-q5_0.bin)"
        required: true
      quantize:
        description: "양자화 종류 (예: q5_0). 비우면 원본 그대로 올린다."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 받기
        run: |
          curl -L --fail --retry 3 -o "${{ inputs.name }}" "${{ inputs.url }}"
          ls -lh "${{ inputs.name }}"
      # f16 ggml 은 1.5GB 라 폰에 못 넣는다. 러너가 q5_0 으로 줄이면 1/3 이 된다.
      - name: 양자화
        if: ${{ inputs.quantize != '' }}
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build -j --target quantize \
            || cmake --build whisper.cpp/build -j
          mv "${{ inputs.name }}" input-f16.bin
          ./whisper.cpp/build/bin/quantize input-f16.bin "${{ inputs.name }}" "${{ inputs.quantize }}"
          rm input-f16.bin
          ls -lh "${{ inputs.name }}"
      - name: 릴리스에 붙이기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models
          name: 전사 모델 보관함
          body: |
            앱의 "한국어 파인튜닝 모델 추가"에서 아래 파일 주소를 넣어 받습니다.
            이 릴리스는 모델 파일 보관용이라 판 번호와 무관합니다.
          prerelease: true
          files: ${{ inputs.name }}
